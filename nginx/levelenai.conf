upstream django {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Büyük body'leri sınırla (form, upload)
    client_max_body_size 10M;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # ---------------------------------------------------------
    # Bot / Scanner engelleme — Django'ya iletmeden 444 döndür
    # ---------------------------------------------------------

    # Tehlikeli dosya uzantıları
    location ~* \.(env|php|php3|php4|php5|phtml|asp|aspx|cgi|pl|sh|bak|sql|log|ini|cfg|conf|htpasswd)$ {
        return 444;
    }

    # WordPress / yaygın tarama hedefleri
    location ~* ^/(wp-admin|wp-login\.php|wp-cron\.php|wp-config\.php|xmlrpc\.php|wp-content|wp-includes|phpmyadmin|pma|myadmin|mysqladmin|mysql|administrator|joomla|drupal|magento) {
        return 444;
    }

    # Gizli dosyalar
    location ~* ^/\.(git|svn|hg|env|htaccess|htpasswd|DS_Store) {
        return 444;
    }

    # Kurulum / yönetim scriptleri
    location ~* ^/(config\.php|setup\.php|install\.php|admin\.php|db\.php|database\.php|info\.php|test\.php|shell\.php|cmd\.php) {
        return 444;
    }

    # ---------------------------------------------------------
    # Normal trafik → Django
    # ---------------------------------------------------------

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
        proxy_connect_timeout 60;
        proxy_send_timeout 120;

        # Büyük yanıtlar için buffer
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }

    # Statik dosyalar WhiteNoise tarafından Django üzerinden sunuluyor;
    # ayrı bir static/ bloğu gerekmez. Gerekirse nginx'ten servis etmek
    # için staticfiles/ dizinini volume olarak mount et ve aşağıdaki bloğu
    # etkinleştir:
    #
    # location /static/ {
    #     alias /app/staticfiles/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
}
