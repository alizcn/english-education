<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#g1)"/>
  <!-- Open book base -->
  <g transform="translate(256,280)">
    <!-- Left page -->
    <path d="M-10,-80 C-10,-80 -30,-90 -100,-90 C-130,-90 -150,-80 -150,-80 L-150,60 C-150,60 -130,50 -100,50 C-30,50 -10,60 -10,60 Z" fill="rgba(255,255,255,0.95)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- Right page -->
    <path d="M10,-80 C10,-80 30,-90 100,-90 C130,-90 150,-80 150,-80 L150,60 C150,60 130,50 100,50 C30,50 10,60 10,60 Z" fill="rgba(255,255,255,0.85)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- Book spine -->
    <path d="M-10,-80 L-10,60 M10,-80 L10,60" stroke="rgba(79,70,229,0.2)" stroke-width="2" fill="none"/>
    <!-- Text lines on left page -->
    <line x1="-130" y1="-55" x2="-30" y2="-55" stroke="url(#g2)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <line x1="-130" y1="-35" x2="-50" y2="-35" stroke="url(#g2)" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
    <line x1="-130" y1="-15" x2="-40" y2="-15" stroke="url(#g2)" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
    <line x1="-130" y1="5" x2="-60" y2="5" stroke="url(#g2)" stroke-width="5" stroke-linecap="round" opacity="0.2"/>
    <!-- Checkmark on right page (learning complete feel) -->
    <path d="M50,-20 L80,10 L130,-40" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  </g>
  <!-- Chat bubble floating top-right -->
  <g transform="translate(370,120)">
    <rect x="-55" y="-35" width="110" height="60" rx="18" fill="rgba(255,255,255,0.95)"/>
    <polygon points="15,25 5,45 30,25" fill="rgba(255,255,255,0.95)"/>
    <!-- Three dots -->
    <circle cx="-20" cy="-5" r="6" fill="url(#g2)"/>
    <circle cx="0" cy="-5" r="6" fill="url(#g2)" opacity="0.7"/>
    <circle cx="20" cy="-5" r="6" fill="url(#g2)" opacity="0.4"/>
  </g>
  <!-- Subtle sparkle top-left -->
  <g transform="translate(130,115)" opacity="0.8">
    <path d="M0,-18 L4,-4 L18,0 L4,4 L0,18 L-4,4 L-18,0 L-4,-4 Z" fill="white" opacity="0.7"/>
  </g>
</svg>
