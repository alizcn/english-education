<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 76" role="img" aria-label="HireUp">
  <defs>
    <linearGradient id="hu-grad-primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="hu-grad-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="hu-grad-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="hu-soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <g filter="url(#hu-soft-shadow)" opacity="0.35">
    <rect x="4" y="12" width="60" height="54" rx="16" fill="url(#hu-grad-primary)"/>
  </g>

  <g>
    <rect x="4" y="8" width="60" height="54" rx="16" fill="url(#hu-grad-primary)"/>
    <rect x="4" y="8" width="60" height="22" rx="16" fill="url(#hu-grad-shine)"/>
    <path d="M 20 42 L 34 24 L 48 42" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 34 24 L 34 52" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <circle cx="56" cy="20" r="3.5" fill="#ffffff" opacity="0.92"/>
  </g>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-0.035em">
    <text x="76" y="51" font-size="40" fill="url(#hu-grad-primary)">Hire</text>
    <text x="165" y="51" font-size="40" fill="url(#hu-grad-accent)" font-style="italic">Up</text>
    <path d="M 240 30 l 6 -6 l 6 6" stroke="url(#hu-grad-accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 246 24 L 246 50" stroke="url(#hu-grad-accent)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
