{% comment %}
Inline LevelEnAI logo — clean sans-serif wordmark + subtle accents.
Params (context vars):
  logo_height: CSS height (default 42px)
  logo_variant: "full" (default) or "mark"
{% endcomment %}
{% with h=logo_height|default:"42px" %}
<svg class="levelenai-svg" viewBox="0 0 420 110" role="img" aria-label="LevelEnAI" style="height:{{ h }}; width:auto; display:block;" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="le-text" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4338ca"/>
            <stop offset="55%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <linearGradient id="le-accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
    </defs>

    <circle cx="42" cy="16" r="3" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="352" cy="74" r="2.5" fill="#ec4899" opacity="0.65"/>
    <path d="M 18 32 l 3 -6 l 3 6 l 6 3 l -6 3 l -3 6 l -3 -6 l -6 -3 z" fill="#8b5cf6" opacity="0.55"/>

    <g transform="translate(116 4)">
        <path d="M 8 0 L 10 10 L 20 12 L 10 14 L 8 24 L 6 14 L -4 12 L 6 10 Z"
              fill="url(#le-accent)" opacity="0.95"/>
        <circle cx="22" cy="2" r="1.8" fill="#ec4899" opacity="0.7"/>
    </g>

    <text x="20" y="80"
          font-family="'Inter', 'Segoe UI', sans-serif"
          font-size="58"
          font-weight="700"
          fill="url(#le-text)"
            style="letter-spacing:-1.2px;">Level<tspan font-weight="700" fill="url(#le-accent)">En</tspan><tspan font-weight="800" fill="url(#le-accent)">AI</tspan></text>
</svg>
{% endwith %}
