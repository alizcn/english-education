{% comment %}
Inline Levelenai logo — script font + decorative swoosh + AI sparkle accent.
Params (context vars):
  logo_height: CSS height (default 42px)
  logo_variant: "full" (default) or "mark"
{% endcomment %}
{% with h=logo_height|default:"42px" %}
<svg class="levelenai-svg" viewBox="0 0 420 110" role="img" aria-label="Levelenai" style="height:{{ h }}; width:auto; display:block;" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="le-swoosh" x1="0" y1="0.5" x2="1" y2="0.5">
            <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.0"/>
            <stop offset="25%" stop-color="#4f46e5" stop-opacity="0.85"/>
            <stop offset="55%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <linearGradient id="le-text" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4338ca"/>
            <stop offset="55%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <linearGradient id="le-accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <filter id="le-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <path d="M 12 84 Q 90 92 185 72 T 402 22"
          fill="none" stroke="url(#le-swoosh)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <path d="M 388 18 l 14 2 l -6 13"
          fill="none" stroke="#ec4899" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="42" cy="16" r="3" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="352" cy="74" r="2.5" fill="#ec4899" opacity="0.65"/>
    <path d="M 18 32 l 3 -6 l 3 6 l 6 3 l -6 3 l -3 6 l -3 -6 l -6 -3 z" fill="#8b5cf6" opacity="0.55"/>

    <g transform="translate(116 4)">
        <path d="M 8 0 L 10 10 L 20 12 L 10 14 L 8 24 L 6 14 L -4 12 L 6 10 Z"
              fill="url(#le-accent)" opacity="0.95"/>
        <circle cx="22" cy="2" r="1.8" fill="#ec4899" opacity="0.7"/>
    </g>

    <text x="20" y="82"
          font-family="'Pacifico', 'Kaushan Script', cursive"
          font-size="72"
          fill="url(#le-text)"
          style="letter-spacing:-0.5px;"
          filter="url(#le-glow)">Level<tspan font-style="normal" fill="url(#le-accent)">enai</tspan></text>
</svg>
{% endwith %}
