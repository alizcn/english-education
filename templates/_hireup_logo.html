{% comment %}
Inline HireUp logo — DietUp style (script font + decorative swoosh + accent).
Params (context vars):
  logo_height: CSS height (default 42px)
  logo_variant: "full" (default) or "mark"
{% endcomment %}
{% with h=logo_height|default:"42px" %}
<svg class="hireup-svg" viewBox="0 0 300 110" role="img" aria-label="HireUp" style="height:{{ h }}; width:auto; display:block;" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="hu-swoosh" x1="0" y1="0.5" x2="1" y2="0.5">
            <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.0"/>
            <stop offset="25%" stop-color="#4f46e5" stop-opacity="0.85"/>
            <stop offset="55%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <linearGradient id="hu-text" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4338ca"/>
            <stop offset="55%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <linearGradient id="hu-accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <filter id="hu-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <path d="M 12 84 Q 70 90 135 70 T 282 22"
          fill="none" stroke="url(#hu-swoosh)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <path d="M 270 18 l 14 2 l -6 13"
          fill="none" stroke="#ec4899" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="38" cy="16" r="3" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="248" cy="74" r="2.5" fill="#ec4899" opacity="0.65"/>
    <path d="M 18 32 l 3 -6 l 3 6 l 6 3 l -6 3 l -3 6 l -3 -6 l -6 -3 z" fill="#8b5cf6" opacity="0.55"/>
    <path d="M 265 60 l 2 -4 l 2 4 l 4 2 l -4 2 l -2 4 l -2 -4 l -4 -2 z" fill="#4f46e5" opacity="0.45"/>

    <g transform="translate(73 10)">
        <rect x="-1" y="0" width="10" height="16" rx="5" fill="url(#hu-accent)"/>
        <path d="M -6 12 Q 4 24 14 12" fill="none" stroke="url(#hu-accent)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="4" y1="24" x2="4" y2="30" stroke="url(#hu-accent)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <text x="20" y="82"
          font-family="'Pacifico', 'Kaushan Script', cursive"
          font-size="72"
          fill="url(#hu-text)"
          style="letter-spacing:-0.5px;"
          filter="url(#hu-glow)">Hire<tspan font-style="normal" fill="url(#hu-accent)">Up</tspan></text>
</svg>
{% endwith %}
