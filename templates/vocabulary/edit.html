{% extends 'base.html' %}
{% load i18n learn_extras %}
{% block title %}{% trans "Kelime düzenle" %}{% endblock %}

{% block content %}
<div class="page-header">
    <h2>{% trans "Kelime düzenle" %}</h2>
    <a href="{% url 'vocabulary:list' %}" class="btn btn-ghost btn-sm">← {% trans "Geri" %}</a>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <label>{% target_name %}
            <input type="text" name="term" value="{{ word.term }}" required>
        </label>
        <label>{% trans "Türkçe" %}
            <input type="text" name="meaning" value="{{ word.meaning }}" required>
        </label>
        <label>{% trans "Örnek (EN)" %}
            <input type="text" name="example" value="{{ word.example }}">
        </label>
        <label>{% trans "Örnek (TR)" %}
            <input type="text" name="example_translation" value="{{ word.example_translation }}">
        </label>
        <label>{% trans "Sözcük türü" %}
            <input type="text" name="part_of_speech" value="{{ word.part_of_speech }}">
        </label>
        <label>{% trans "Kaynak" %}
            <input type="text" name="source" value="{{ word.source }}">
        </label>
        <div class="btn-row mt-2">
            <button type="submit" class="btn">{% trans "Kaydet" %}</button>
            <a href="{% url 'vocabulary:list' %}" class="btn btn-secondary">{% trans "Vazgeç" %}</a>
        </div>
    </form>
</div>
{% endblock %}
