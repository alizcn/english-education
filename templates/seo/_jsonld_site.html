{% load static i18n learn_extras %}{% get_current_language as LANG %}{% lang_name target_language as tlang %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ seo.site_url }}/#organization",
      "name": "LevelEnAI",
      "url": "{{ seo.site_url }}/",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ seo.site_url }}{% static 'icons/icon-512.png' %}",
        "width": 512,
        "height": 512
      },
      "image": "{{ seo.default_image }}",
      "description": "{% blocktrans with lang=tlang %}{{ lang }} kelime, gramer ve AI destekli mülakat hazırlığı sunan ücretsiz platform.{% endblocktrans %}",
      "parentOrganization": {
        "@type": "Organization",
        "name": "Codezzium"
      }
    },
    {
      "@type": "WebSite",
      "@id": "{{ seo.site_url }}/#website",
      "url": "{{ seo.site_url }}/",
      "name": "LevelEnAI",
      "inLanguage": "{{ LANG }}",
      "publisher": { "@id": "{{ seo.site_url }}/#organization" }
    },
    {
      "@type": "WebApplication",
      "@id": "{{ seo.site_url }}/#app",
      "name": "LevelEnAI",
      "url": "{{ seo.site_url }}/",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web, Android, iOS",
      "inLanguage": [{% for code in seo.ui_codes %}"{{ code }}"{% if not forloop.last %}, {% endif %}{% endfor %}],
      "description": "{% blocktrans with lang=tlang %}Pozisyona özel AI mülakat soruları, binlerce kelime ve gramer konusuyla {{ lang }} hazırlık uygulaması.{% endblocktrans %}",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "TRY",
        "availability": "https://schema.org/InStock"
      },
      "isAccessibleForFree": true,
      "publisher": { "@id": "{{ seo.site_url }}/#organization" }
    }
  ]
}
</script>
