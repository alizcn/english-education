services:
  redis:
    image: redis:7-alpine
    container_name: english-education-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - ./data/redis:/data

  web:
    build: .
    container_name: english-education
    restart: unless-stopped
    ports:
      - "8070:8000"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/db.sqlite3
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # CLAUDE_AUTH_MODE=cli için: Claude Code CLI kimliği bu oturumdan okunur.
      # CLAUDE_AUTH_MODE=api kullanılacaksa bu iki satır kaldırılabilir.
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: english-education-celery
    restart: unless-stopped
    # concurrency=1: her görev kendi içinde CLAUDE_MAX_PARALLEL (5) subprocess'e
    # açılıyor ve her biri ~220-400 MB. concurrency=2 en kötü durumda 10 subprocess
    # ≈ 3 GB demekti; OOM-kill + acks_late yeniden teslimi sonsuz döngü yaratır.
    # Eşzamanlı ikinci kullanıcı sıraya girer — OOM'da 15 dakika beklemekten iyi.
    command: celery -A config worker -l info --concurrency=1
    mem_limit: 3g
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/db.sqlite3
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ~/.claude:/root/.claude
      - ~/.claude.json:/root/.claude.json
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery_beat:
    build: .
    container_name: english-education-celery-beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/db.sqlite3
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
